<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSE6 休憩クイズ</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a0f1e;
    --navy2: #111827;
    --navy3: #1a2235;
    --gold: #c9a84c;
    --gold2: #e8c97a;
    --gold3: #f5e6b8;
    --white: #f8f4ee;
    --sub: #8a9ab5;
    --correct: #4ade80;
    --wrong: #f87171;
    --border: rgba(201,168,76,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  /* 背景の装飾 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 20%, rgba(201,168,76,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 80%, rgba(201,168,76,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 620px;
    position: relative;
    z-index: 1;
  }

  /* ヘッダー */
  .header {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.8s ease both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .badge::before, .badge::after {
    content: '';
    display: block;
    width: 24px;
    height: 1px;
    background: var(--gold);
    opacity: 0.5;
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 40px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 2px;
    line-height: 1.1;
  }

  .subtitle {
    font-size: 13px;
    color: var(--sub);
    margin-top: 10px;
    letter-spacing: 1px;
  }

  /* プログレス */
  .progress-wrap {
    margin-bottom: 28px;
    animation: fadeDown 0.8s 0.1s ease both;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--sub);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .progress-bar {
    height: 2px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: visible;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold2));
    border-radius: 2px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    right: -4px;
    top: -3px;
    width: 8px;
    height: 8px;
    background: var(--gold2);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--gold);
  }

  /* カード */
  .card {
    background: var(--navy2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.8s 0.2s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.5;
  }

  /* 問題エリア（フェードスライド） */
  .question-wrap {
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .question-wrap.exit {
    opacity: 0;
    transform: translateX(-20px);
  }

  .question-wrap.enter {
    animation: slideIn 0.4s ease both;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .q-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .q-text {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.6;
    color: var(--white);
    margin-bottom: 28px;
  }

  /* 選択肢 */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    background: transparent;
    border: 1px solid rgba(138,154,181,0.2);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
    font-size: 15px;
    color: var(--white);
    position: relative;
    overflow: hidden;
  }

  .opt::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.06), transparent);
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .opt:hover:not(.disabled) {
    border-color: rgba(201,168,76,0.4);
    transform: translateX(4px);
  }

  .opt:hover:not(.disabled)::before {
    opacity: 1;
  }

  .opt-label {
    width: 32px;
    height: 32px;
    border: 1px solid rgba(138,154,181,0.3);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--sub);
    flex-shrink: 0;
    transition: all 0.25s ease;
  }

  /* 正解アニメーション */
  .opt.correct {
    border-color: var(--gold);
    background: rgba(201,168,76,0.08);
    animation: correctPulse 0.5s ease;
  }

  @keyframes correctPulse {
    0%   { box-shadow: 0 0 0 0 rgba(201,168,76,0.4); }
    50%  { box-shadow: 0 0 0 8px rgba(201,168,76,0); }
    100% { box-shadow: 0 0 0 0 rgba(201,168,76,0); }
  }

  .opt.correct .opt-label {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--navy);
  }

  /* 不正解アニメーション */
  .opt.wrong {
    border-color: rgba(248,113,113,0.4);
    background: rgba(248,113,113,0.06);
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-6px); }
    60%       { transform: translateX(6px); }
  }

  .opt.wrong .opt-label {
    background: rgba(248,113,113,0.2);
    border-color: var(--wrong);
    color: var(--wrong);
  }

  .opt.disabled { cursor: default; }

  /* 解説 */
  .explanation {
    margin-top: 24px;
    padding: 18px 20px;
    background: rgba(201,168,76,0.05);
    border-left: 2px solid var(--gold);
    border-radius: 0 10px 10px 0;
    font-size: 13px;
    line-height: 1.9;
    color: rgba(248,244,238,0.85);
    display: none;
    animation: fadeUp 0.4s ease both;
  }

  .explanation.show { display: block; }

  .exp-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  /* 次へボタン */
  .next-btn {
    margin-top: 24px;
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border: none;
    border-radius: 12px;
    color: var(--navy);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    display: none;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .next-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .next-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,76,0.3); }
  .next-btn:hover::before { opacity: 1; }
  .next-btn:active { transform: translateY(0); }
  .next-btn.show { display: block; animation: fadeUp 0.4s ease both; }

  /* 結果 */
  .result { text-align: center; display: none; }
  .result.show { display: block; animation: fadeUp 0.6s ease both; }

  .result-ornament {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .result-score {
    font-family: 'Cormorant Garamond', serif;
    font-size: 88px;
    font-weight: 700;
    color: var(--white);
    line-height: 1;
    margin-bottom: 4px;
    background: linear-gradient(135deg, var(--gold3), var(--gold), var(--gold2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s ease infinite;
    background-size: 200% 200%;
  }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .result-label {
    font-size: 13px;
    color: var(--sub);
    letter-spacing: 2px;
    margin-bottom: 24px;
  }

  .result-msg {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.8;
    color: rgba(248,244,238,0.9);
    margin-bottom: 32px;
    padding: 20px 24px;
    background: rgba(201,168,76,0.05);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-align: left;
  }

  .btn-group { display: flex; flex-direction: column; gap: 10px; }

  .retry-btn {
    padding: 15px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border: none;
    border-radius: 12px;
    color: var(--navy);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    letter-spacing: 1px;
  }

  .retry-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,76,0.3); }

  .retry-wrong-btn {
    padding: 15px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--gold);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
    display: none;
    letter-spacing: 1px;
  }

  .retry-wrong-btn:hover { border-color: var(--gold); background: rgba(201,168,76,0.05); }
  .retry-wrong-btn.show { display: block; }

  /* 金の粒子エフェクト */
  .particle {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    animation: particleFly 1s ease forwards;
    z-index: 999;
  }

  @keyframes particleFly {
    0%   { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="badge">SSE6 · Break Quiz</div>
    <div class="title">休憩クイズ</div>
    <div class="subtitle">前半の内容を振り返ろう — 全3問</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-text">Question 1 / 3</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="card" id="quiz-card">
    <div class="question-wrap" id="q-wrap">
      <div class="q-number" id="q-num">Question 01</div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <div class="explanation" id="explanation">
        <div class="exp-title">— 解説 —</div>
        <div id="exp-text"></div>
      </div>
      <button class="next-btn" id="next-btn">次の問題へ →</button>
    </div>
  </div>
  <div class="card result" id="result">
    <div class="result-ornament">— Result —</div>
    <div class="result-score" id="result-score"></div>
    <div class="result-label">正解数 / 3問</div>
    <div class="result-msg" id="result-msg"></div>
    <div class="btn-group">
      <button class="retry-btn" onclick="restart()">もう一度最初から</button>
      <button class="retry-wrong-btn" id="retry-wrong-btn" onclick="retryWrong()">間違えた問題だけもう一度</button>
    </div>
  </div>
</div>
<script>
function escHTML(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

const allQuestions = [
  {
    q: "スマホでよく見る「三本線のアイコン」の名前は？",
    opts: ["サンドイッチメニュー", "ハンバーガーメニュー", "ピザメニュー", "トーストメニュー"],
    ans: 1,
    exp: "三本線がハンバーガーに見えることからこの名前がついています🍔 スマホサイトで横並びのナビゲーションが入りきらないとき、このアイコンをタップするとメニューが開く設計が定番です！"
  },
  {
    q: "スマホでハンバーガーメニューがよく使われる理由は？",
    opts: ["スマホは画面が狭くてナビゲーションが入りきらないから", "PCでは動かないから", "jQueryが必要だから", "おしゃれだから"],
    ans: 0,
    exp: "正解！スマホは画面幅が狭いので、PCのように横並びのナビゲーションをそのまま表示できません。そこでハンバーガーメニューをタップしてナビを表示する設計が定番になっています！"
  },
  {
    q: "Webサイトをスマホでもきれいに表示させる対応のことを何という？",
    opts: ["モバイル対応", "レスポンシブデザイン", "スマホデザイン", "コンパクトデザイン"],
    ans: 1,
    exp: "正解！レスポンシブデザインとは、画面の幅に応じてレイアウトが自動で変わる設計のことです。今日作ったスマホ版CSSもレスポンシブデザインの一部です！"
  }
];

let questions = [...allQuestions];
let wrongIndices = [];
let current = 0, score = 0, answered = false, isRetryMode = false;

function render() {
  const q = questions[current];
  const total = questions.length;
  const wrap = document.getElementById('q-wrap');
  wrap.classList.remove('enter');
  void wrap.offsetWidth;
  wrap.classList.add('enter');

  document.getElementById('q-num').textContent = `Question 0${current + 1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog-text').textContent = `Question ${current + 1} / ${total}`;
  const pct = Math.round((current / total) * 100);
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('explanation').classList.remove('show');
  document.getElementById('next-btn').classList.remove('show');
  answered = false;

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  const labels = ['A','B','C','D'];
  q.opts.forEach((o, i) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="opt-label">${labels[i]}</span><span>${escHTML(o)}</span>`;
    div.onclick = () => select(i);
    opts.appendChild(div);
  });
}

function spawnParticles(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 5 + 3;
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * 80 + 40;
    p.style.cssText = `
      left:${cx}px; top:${cy}px;
      width:${size}px; height:${size}px;
      background:${Math.random() > 0.5 ? '#c9a84c' : '#f5e6b8'};
      --tx:${Math.cos(angle)*dist}px;
      --ty:${Math.sin(angle)*dist}px;
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
}

function select(i) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o => o.classList.add('disabled'));
  const isCorrect = i === q.ans;
  opts[i].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) {
    opts[q.ans].classList.add('correct');
    if (!isRetryMode) wrongIndices.push(allQuestions.indexOf(q));
  } else {
    spawnParticles(opts[i]);
  }
  if (isCorrect) score++;
  document.getElementById('exp-text').textContent = q.exp;
  document.getElementById('explanation').classList.add('show');
  const btn = document.getElementById('next-btn');
  btn.textContent = current < questions.length - 1 ? '次の問題へ →' : '結果を見る';
  btn.classList.add('show');
}

document.getElementById('next-btn').onclick = () => {
  const wrap = document.getElementById('q-wrap');
  wrap.classList.add('exit');
  setTimeout(() => {
    wrap.classList.remove('exit');
    current++;
    if (current < questions.length) render();
    else showResult();
  }, 300);
};

function showResult() {
  document.getElementById('quiz-card').style.display = 'none';
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-pct').textContent = '100%';
  document.getElementById('result').classList.add('show');
  document.getElementById('result-score').textContent = `${score} / ${questions.length}`;

  const msgs = [
    "0問正解！大丈夫、間違えた瞬間が一番記憶に残ります。今日ここに来て手を動かしてくれただけで十分すごい！後半もそのまま一緒に進もう！",
    "1問正解！ここに来て、聞いて、参加してくれた。それだけでもう十分えらいです！1問取れたということは確実に理解が始まってる証拠！後半も一緒にいこう！",
    "2問正解！あと1問で満点！その悔しさが記憶に残る。頑張っててとってもえらいです！後半も全力でいこう！",
    "満点！完璧！前半の内容バッチリ理解できてる。今日ここに来て真剣に取り組んでくれた、それがもう最高にえらい！後半もこの調子で絶対いける！！"
  ];
  document.getElementById('result-msg').textContent = msgs[score];

  const wrongBtn = document.getElementById('retry-wrong-btn');
  if (wrongIndices.length > 0 && !isRetryMode) wrongBtn.classList.add('show');
}

function restart() {
  questions = [...allQuestions]; wrongIndices = []; current = 0; score = 0; isRetryMode = false;
  document.getElementById('quiz-card').style.display = 'block';
  document.getElementById('result').classList.remove('show');
  document.getElementById('retry-wrong-btn').classList.remove('show');
  render();
}

function retryWrong() {
  questions = wrongIndices.map(i => allQuestions[i]); current = 0; score = 0; isRetryMode = true;
  document.getElementById('quiz-card').style.display = 'block';
  document.getElementById('result').classList.remove('show');
  document.getElementById('retry-wrong-btn').classList.remove('show');
  render();
}

render();
</script>
</body>
</html>
