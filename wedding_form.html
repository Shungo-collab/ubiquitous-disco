<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お祝いメッセージを送る</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Noto+Serif+JP:wght@300;400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #c8a880;
    --accent-dark: #5a3e2b;
    --bg: #faf7f2;
    --surface: #fff;
    --text: #3a3028;
    --text-muted: #8a7060;
    --border: #e8d8c0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Serif JP', serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .header { background: var(--accent-dark); text-align: center; padding: 2.5rem 1.5rem 2rem; }
  .header-label { font-family: 'Lato', sans-serif; font-weight: 300; font-size: 10px; letter-spacing: 0.5em; color: rgba(255,255,255,0.45); text-transform: uppercase; margin-bottom: 0.75rem; }
  .header-names { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(2rem, 8vw, 3.5rem); color: #faf0e0; letter-spacing: 0.05em; line-height: 1; }
  .header-names .amp { font-style: italic; color: var(--accent); margin: 0 0.25em; }
  .header-sub { font-family: 'Lato', sans-serif; font-weight: 300; font-size: 11px; letter-spacing: 0.3em; color: rgba(255,255,255,0.35); margin-top: 0.75rem; }

  .form-wrap { max-width: 560px; margin: 2.5rem auto; padding: 0 1.25rem 4rem; }
  .form-intro { text-align: center; margin-bottom: 2rem; }
  .form-intro h2 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 1.6rem; color: var(--accent-dark); margin-bottom: 0.5rem; }
  .form-intro p { font-size: 0.8rem; color: var(--text-muted); line-height: 1.9; }

  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.75rem 1.5rem; margin-bottom: 1rem; }
  .field { margin-bottom: 1.25rem; }
  .field:last-child { margin-bottom: 0; }

  label { display: block; font-family: 'Lato', sans-serif; font-size: 11px; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 8px; }
  label .req { color: #c89870; margin-left: 2px; }

  input[type="text"], textarea {
    width: 100%; padding: 12px 14px; font-size: 15px;
    font-family: 'Noto Serif JP', serif;
    background: var(--bg); border: 0.5px solid var(--border);
    border-radius: 8px; color: var(--text); outline: none;
    transition: border-color 0.2s; -webkit-appearance: none;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); background: #fff; }
  textarea { resize: vertical; min-height: 140px; line-height: 1.8; }
  .char-count { text-align: right; font-size: 11px; color: var(--text-muted); margin-top: 5px; font-family: 'Lato', sans-serif; }

  .upload-area { border: 1px dashed var(--border); border-radius: 8px; padding: 2.5rem 1rem; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--bg); }
  .upload-area:hover { border-color: var(--accent); }
  .upload-area svg { display: block; margin: 0 auto 10px; }
  .upload-area p { font-size: 13px; color: var(--text-muted); font-family: 'Lato', sans-serif; font-weight: 300; }
  .upload-area .upload-sub { font-size: 11px; color: #c8b0a0; margin-top: 4px; }

  .photo-preview { display: none; position: relative; }
  .photo-preview img { width: 100%; max-height: 240px; object-fit: cover; border-radius: 8px; }
  .photo-remove { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,0.55); color: white; border: none; cursor: pointer; font-size: 16px; line-height: 28px; text-align: center; }

  .submit-btn { width: 100%; padding: 16px; margin-top: 1.25rem; background: var(--accent-dark); color: #faf0e0; border: none; border-radius: 8px; font-size: 14px; font-family: 'Lato', sans-serif; letter-spacing: 0.15em; cursor: pointer; transition: all 0.2s; }
  .submit-btn:hover { background: #7a5e3b; }
  .submit-btn:active { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .success-screen { display: none; text-align: center; padding: 4rem 1.5rem; }
  .success-ring { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
  .success-screen h2 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 1.6rem; color: var(--accent-dark); margin-bottom: 0.75rem; }
  .success-screen p { font-size: 13px; color: var(--text-muted); line-height: 1.9; }
  .back-btn { display: inline-block; margin-top: 2rem; padding: 10px 28px; border: 0.5px solid var(--border); border-radius: 100px; font-size: 12px; font-family: 'Lato', sans-serif; color: var(--text-muted); cursor: pointer; background: none; transition: all 0.2s; }
  .back-btn:hover { border-color: var(--accent); color: var(--accent-dark); }

  .error-msg { display: none; background: #fff5f5; border: 0.5px solid #f0c0c0; border-radius: 8px; padding: 12px 14px; font-size: 13px; color: #a03030; margin-top: 0.75rem; font-family: 'Lato', sans-serif; }
</style>
</head>
<body>

<script>
  const SUPABASE_URL = 'https://qrynpbgilwnfymuihsse.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyeW5wYmdpbHduZnltdWloc3NlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2OTQxMjQsImV4cCI6MjA5MDI3MDEyNH0.KtYelj9iRmj3wVZtXAaRmNYRx87MDa8iaV-z5Wt2cNI';
  const TABLE_NAME = 'wedding_messages';
  const GROOM = '千葉大次郎';
  const BRIDE = '鈴木千笑';
</script>

<header class="header">
  <p class="header-label">Congratulations</p>
  <h1 class="header-names" id="header-names"></h1>
  <p class="header-sub">ご入籍おめでとうございます</p>
</header>

<main class="form-wrap">
  <div id="form-section">
    <div class="form-intro">
      <h2>お祝いメッセージ</h2>
      <p>お二人への想いを送ってください<br>みんなのメッセージがサイトに届きます</p>
    </div>

    <div class="card">
      <div class="field">
        <label>あなたのお名前 <span class="req">*</span></label>
        <input type="text" id="inp-name" placeholder="山田 花子" maxlength="20">
      </div>
      <div class="field">
        <label>メッセージ <span class="req">*</span></label>
        <textarea id="inp-msg" placeholder="ご入籍おめでとうございます！&#10;お二人の笑顔がずっと続きますように..." maxlength="400" oninput="updateCount()"></textarea>
        <div class="char-count"><span id="char-count">0</span> / 400</div>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label>写真（任意）</label>
        <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c8a880" stroke-width="1">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <p>タップして写真を追加</p>
          <p class="upload-sub">JPG / PNG · 最大 5MB</p>
        </div>
        <div class="photo-preview" id="photo-preview">
          <img id="preview-img" src="" alt="">
          <button class="photo-remove" onclick="removePhoto()">×</button>
        </div>
        <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handlePhoto(this)">
      </div>
    </div>

    <div class="error-msg" id="error-msg"></div>
    <button class="submit-btn" id="submit-btn" onclick="submitMessage()">メッセージを送る</button>
  </div>

  <div class="success-screen" id="success-screen">
    <div class="success-ring">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c8a880" stroke-width="1.5">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h2>届きました</h2>
    <p>メッセージをお送りしました。<br>お二人に届きますように。</p>
    <button class="back-btn" onclick="resetForm()">別のメッセージを送る</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  document.getElementById('header-names').innerHTML = GROOM + '<span class="amp">&amp;</span>' + BRIDE;

  let photoBase64 = null;

  function updateCount() {
    document.getElementById('char-count').textContent = document.getElementById('inp-msg').value.length;
  }

  function handlePhoto(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showError('写真のサイズは 5MB 以内にしてください'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      photoBase64 = e.target.result;
      document.getElementById('preview-img').src = photoBase64;
      document.getElementById('upload-area').style.display = 'none';
      document.getElementById('photo-preview').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  function removePhoto() {
    photoBase64 = null;
    document.getElementById('photo-preview').style.display = 'none';
    document.getElementById('upload-area').style.display = 'block';
    document.getElementById('file-input').value = '';
  }

  function showError(msg) { const el = document.getElementById('error-msg'); el.textContent = msg; el.style.display = 'block'; }
  function clearError() { document.getElementById('error-msg').style.display = 'none'; }

  async function submitMessage() {
    clearError();
    const name = document.getElementById('inp-name').value.trim();
    const msg  = document.getElementById('inp-msg').value.trim();
    if (!name) { showError('お名前を入力してください'); return; }
    if (!msg)  { showError('メッセージを入力してください'); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = '送信中...';

    const { error } = await sbClient.from(TABLE_NAME).insert([{
      name, message: msg, photo_base64: photoBase64 || null,
      created_at: new Date().toISOString()
    }]);

    if (error) {
      showError('送信に失敗しました。もう一度お試しください。');
      btn.disabled = false; btn.textContent = 'メッセージを送る';
      return;
    }

    document.getElementById('form-section').style.display = 'none';
    document.getElementById('success-screen').style.display = 'block';
    btn.disabled = false; btn.textContent = 'メッセージを送る';
  }

  function resetForm() {
    document.getElementById('inp-name').value = '';
    document.getElementById('inp-msg').value = '';
    updateCount(); removePhoto(); clearError();
    document.getElementById('form-section').style.display = 'block';
    document.getElementById('success-screen').style.display = 'none';
  }
</script>
</body>
</html>
