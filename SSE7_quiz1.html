<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSE7 休憩クイズ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFE566;
    --pink: #FF6B9D;
    --blue: #4ECDC4;
    --purple: #A78BFA;
    --dark: #1a1a2e;
    --card: #ffffff;
    --text: #1a1a2e;
    --sub: #6b7280;
    --correct: #10b981;
    --wrong: #ef4444;
    --shadow: 4px 4px 0px #1a1a2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--yellow);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,107,157,0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(78,205,196,0.15) 0%, transparent 40%);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .container { width: 100%; max-width: 600px; }

  /* ヘッダー */
  .header {
    text-align: center;
    margin-bottom: 28px;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.8) translateY(-10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .badge {
    display: inline-block;
    background: var(--dark);
    color: var(--yellow);
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 3px;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  .title {
    font-family: 'Nunito', sans-serif;
    font-size: 38px;
    font-weight: 900;
    color: var(--dark);
    line-height: 1.1;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--sub);
    font-weight: 700;
  }

  /* プログレス */
  .progress-wrap {
    margin-bottom: 20px;
    animation: popIn 0.5s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 8px;
  }

  .progress-bar {
    height: 10px;
    background: rgba(26,26,46,0.15);
    border-radius: 10px;
    border: 2px solid var(--dark);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--pink);
    border-radius: 8px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* カード */
  .card {
    background: var(--card);
    border: 3px solid var(--dark);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 32px;
    animation: popIn 0.5s 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .q-number {
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 800;
    color: var(--pink);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .q-text {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.6;
    color: var(--dark);
    margin-bottom: 24px;
  }

  /* 選択肢 */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .opt {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: #f9fafb;
    border: 2.5px solid var(--dark);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-size: 14px;
    font-weight: 700;
    color: var(--dark);
    box-shadow: 2px 2px 0px var(--dark);
  }

  .opt:hover:not(.disabled) {
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0px var(--dark);
    background: #fff;
  }

  .opt:active:not(.disabled) {
    transform: translate(2px, 2px);
    box-shadow: 0px 0px 0px var(--dark);
  }

  .opt-label {
    width: 30px;
    height: 30px;
    background: var(--yellow);
    border: 2px solid var(--dark);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 900;
    flex-shrink: 0;
  }

  .opt.correct {
    background: #d1fae5;
    border-color: var(--correct);
    box-shadow: 2px 2px 0px var(--correct);
    animation: correctBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes correctBounce {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  .opt.correct .opt-label {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }

  .opt.wrong {
    background: #fee2e2;
    border-color: var(--wrong);
    box-shadow: 2px 2px 0px var(--wrong);
    animation: wrongShake 0.4s ease;
  }

  @keyframes wrongShake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-6px); }
    75%     { transform: translateX(6px); }
  }

  .opt.wrong .opt-label {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }

  .opt.disabled { cursor: default; }

  /* 解説 */
  .explanation {
    margin-top: 20px;
    padding: 16px 18px;
    background: #fffbeb;
    border: 2.5px solid var(--dark);
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.9;
    color: var(--dark);
    display: none;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .explanation.show { display: block; }

  .exp-title {
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 800;
    color: var(--pink);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  /* 次へボタン */
  .next-btn {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    background: var(--dark);
    border: 2.5px solid var(--dark);
    border-radius: 12px;
    color: var(--yellow);
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    display: none;
    transition: all 0.15s ease;
    box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
  }

  .next-btn:hover {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0px rgba(0,0,0,0.3);
  }

  .next-btn:active {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0px rgba(0,0,0,0.3);
  }

  .next-btn.show { display: block; animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

  /* 結果 */
  .result { display: none; }
  .result.show { display: block; animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

  .result-card {
    background: var(--card);
    border: 3px solid var(--dark);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 36px 32px;
    text-align: center;
  }

  .result-emoji {
    font-size: 56px;
    margin-bottom: 8px;
    display: block;
    animation: popIn 0.5s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .result-score {
    font-family: 'Nunito', sans-serif;
    font-size: 80px;
    font-weight: 900;
    color: var(--dark);
    line-height: 1;
    margin-bottom: 4px;
  }

  .result-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--sub);
    margin-bottom: 20px;
    letter-spacing: 1px;
  }

  .result-msg {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.8;
    color: var(--dark);
    margin-bottom: 28px;
    padding: 16px 20px;
    background: #f9fafb;
    border: 2.5px solid var(--dark);
    border-radius: 12px;
    text-align: left;
  }

  .btn-group { display: flex; flex-direction: column; gap: 10px; }

  .retry-btn {
    padding: 14px;
    background: var(--dark);
    border: 2.5px solid var(--dark);
    border-radius: 12px;
    color: var(--yellow);
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
  }

  .retry-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px rgba(0,0,0,0.3); }

  .retry-wrong-btn {
    padding: 14px;
    background: transparent;
    border: 2.5px solid var(--dark);
    border-radius: 12px;
    color: var(--dark);
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s ease;
    display: none;
    box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
  }

  .retry-wrong-btn:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px rgba(0,0,0,0.2); }
  .retry-wrong-btn.show { display: block; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="badge">SSE7 · Break Quiz</div>
    <div class="title">休憩クイズ 🎨</div>
    <div class="subtitle">前半の内容を振り返ろう — 全3問</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-text">Question 1 / 3</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="card" id="quiz-card">
    <div class="q-number" id="q-num">Question 01</div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
    <div class="explanation" id="explanation">
      <div class="exp-title">💡 解説</div>
      <div id="exp-text"></div>
    </div>
    <button class="next-btn" id="next-btn">次の問題へ →</button>
  </div>
  <div class="result" id="result">
    <div class="result-card">
      <span class="result-emoji" id="result-emoji">🎉</span>
      <div class="result-score" id="result-score"></div>
      <div class="result-label">正解数 / 3問</div>
      <div class="result-msg" id="result-msg"></div>
      <div class="btn-group">
        <button class="retry-btn" onclick="restart()">もう一度最初から</button>
        <button class="retry-wrong-btn" id="retry-wrong-btn" onclick="retryWrong()">間違えた問題だけもう一度</button>
      </div>
    </div>
  </div>
</div>
<script>
function escHTML(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

const allQuestions = [
  {
    q: "CSSで文字を中央揃えにするプロパティは？",
    opts: ["text-align: center", "margin: auto", "center: true", "中央寄せ"],
    ans: 0,
    exp: "正解！text-align: center は文字の横位置を中央に揃えるプロパティです。今日の演習では section h2 や #concept p に使いました。left にすると左寄せ・right にすると右寄せになります。"
  },
  {
    q: "spanタグはデフォルトでどちらの要素？",
    opts: ["インライン要素", "ブロック要素"],
    ans: 0,
    exp: "正解！spanはデフォルトでインライン要素です。インライン要素は横に並ぼうとするため、幅・高さが指定できません。今日の演習では display: block を書いてブロック要素に変え、日本語を英語の下の行に表示させました！"
  },
  {
    q: "CSSだけで要素の直前に装飾を追加できるのはどれ？",
    opts: ["::before", "background-color", "text-align", "フォントサイズ"],
    ans: 0,
    exp: "正解！::before は「この要素の直前にCSSだけで装飾用の要素を追加する」機能です。今日の演習では section h2::before を使って見出しの上に赤いラインを追加しました。HTMLを変えずに見た目だけCSSで管理できます！"
  }
];

let questions = [...allQuestions];
let wrongIndices = [];
let current = 0, score = 0, answered = false, isRetryMode = false;

const emojis = { 0: "😢", 1: "🌱", 2: "👏", 3: "🎉" };

function render() {
  const q = questions[current];
  const total = questions.length;
  document.getElementById('q-num').textContent = `Question 0${current + 1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog-text').textContent = `Question ${current + 1} / ${total}`;
  const pct = Math.round((current / total) * 100);
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('explanation').classList.remove('show');
  document.getElementById('next-btn').classList.remove('show');
  answered = false;

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  q.opts.forEach((o, i) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="opt-label">${labels[i]}</span><span>${escHTML(o)}</span>`;
    div.onclick = () => select(i);
    opts.appendChild(div);
  });
}

function select(i) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o => o.classList.add('disabled'));
  const isCorrect = i === q.ans;
  opts[i].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) {
    opts[q.ans].classList.add('correct');
    if (!isRetryMode) wrongIndices.push(allQuestions.indexOf(q));
  }
  if (isCorrect) score++;
  document.getElementById('exp-text').textContent = q.exp;
  document.getElementById('explanation').classList.add('show');
  const btn = document.getElementById('next-btn');
  btn.textContent = current < questions.length - 1 ? '次の問題へ →' : '結果を見る';
  btn.classList.add('show');
}

document.getElementById('next-btn').onclick = () => {
  current++;
  if (current < questions.length) render();
  else showResult();
};

function showResult() {
  document.getElementById('quiz-card').style.display = 'none';
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-pct').textContent = '100%';
  document.getElementById('result').classList.add('show');
  document.getElementById('result-score').textContent = `${score} / ${questions.length}`;
  document.getElementById('result-emoji').textContent = emojis[score] || '🎉';

  const msgs = [
    "0問正解！大丈夫、間違えた瞬間が一番記憶に残ります。今日ここに来て手を動かしてくれただけで十分すごい！後半もそのまま一緒に進もう！",
    "1問正解！ここに来て、聞いて、参加してくれた。それだけでもう十分えらいです！1問取れたということは確実に理解が始まってる証拠！後半も一緒にいこう！",
    "2問正解！あと1問で満点！その悔しさが記憶に残る。頑張っててとってもえらいです！後半も全力でいこう！",
    "満点！完璧！前半の内容バッチリ理解できてる。今日ここに来て真剣に取り組んでくれた、それがもう最高にえらい！後半もこの調子で絶対いける！！"
  ];
  document.getElementById('result-msg').textContent = msgs[score];
  if (wrongIndices.length > 0 && !isRetryMode) document.getElementById('retry-wrong-btn').classList.add('show');
}

function restart() {
  questions = [...allQuestions]; wrongIndices = []; current = 0; score = 0; isRetryMode = false;
  document.getElementById('quiz-card').style.display = 'block';
  document.getElementById('result').classList.remove('show');
  document.getElementById('retry-wrong-btn').classList.remove('show');
  render();
}

function retryWrong() {
  questions = wrongIndices.map(i => allQuestions[i]); current = 0; score = 0; isRetryMode = true;
  document.getElementById('quiz-card').style.display = 'block';
  document.getElementById('result').classList.remove('show');
  document.getElementById('retry-wrong-btn').classList.remove('show');
  render();
}

render();
</script>
</body>
</html>
