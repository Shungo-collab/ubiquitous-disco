<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSH5 総復習クイズ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
  :root {
    --bg: #0f0f14;
    --card: #1a1a24;
    --border: #2a2a3a;
    --accent1: #9b59ff;
    --accent2: #ff59a0;
    --text: #f0f0f0;
    --sub: #888;
    --correct: #2ecc71;
    --wrong: #e74c3c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container { width: 100%; max-width: 680px; }
  .header { text-align: center; margin-bottom: 32px; }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .title { font-size: 22px; font-weight: 900; }
  .subtitle { font-size: 13px; color: var(--sub); margin-top: 6px; }
  .progress-wrap { margin-bottom: 28px; }
  .progress-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin-bottom: 8px; }
  .progress-bar { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }
  .q-number { font-size: 12px; color: var(--accent1); font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; }
  .q-text { font-size: 18px; font-weight: 700; line-height: 1.6; margin-bottom: 28px; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 15px;
  }
  .opt:hover:not(.disabled) { border-color: var(--accent1); background: #1a1a2e; }
  .opt-label {
    width: 28px; height: 28px;
    background: var(--border);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    font-family: 'Space Mono', monospace;
  }
  .opt.correct { border-color: var(--correct); background: rgba(46,204,113,0.08); }
  .opt.correct .opt-label { background: var(--correct); color: #000; }
  .opt.wrong { border-color: var(--wrong); background: rgba(231,76,60,0.08); }
  .opt.wrong .opt-label { background: var(--wrong); color: #fff; }
  .opt.disabled { cursor: default; }
  .explanation {
    margin-top: 20px; padding: 16px;
    background: rgba(155,89,255,0.08);
    border-left: 3px solid var(--accent1);
    border-radius: 0 8px 8px 0;
    font-size: 14px; line-height: 1.7;
    display: none;
  }
  .explanation.show { display: block; }
  .exp-title { font-weight: 700; color: var(--accent1); margin-bottom: 6px; font-size: 13px; }
  .next-btn {
    margin-top: 24px; width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border: none; border-radius: 10px;
    color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; display: none;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    transition: opacity 0.2s;
  }
  .next-btn:hover { opacity: 0.85; }
  .next-btn.show { display: block; }

  /* RESULT */
  .result { text-align: center; display: none; }
  .result.show { display: block; }
  .result-score {
    font-size: 72px; font-weight: 900;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; line-height: 1; margin-bottom: 8px;
  }
  .result-label { font-size: 16px; color: var(--sub); margin-bottom: 28px; }
  .result-msg { font-size: 20px; font-weight: 700; margin-bottom: 32px; }

  /* CHAPTER BREAKDOWN */
  .breakdown { margin-bottom: 32px; text-align: left; }
  .breakdown-title { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--sub); margin-bottom: 16px; text-align: center; }
  .chapter-item { margin-bottom: 12px; }
  .chapter-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .chapter-bar { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .chapter-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    border-radius: 4px;
    transition: width 0.8s ease;
  }

  .retry-btn {
    padding: 14px 40px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border: none; border-radius: 10px;
    color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: 'Zen Kaku Gothic New', sans-serif;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="badge">PSH5 · FINAL QUIZ</div>
    <div class="title">総復習クイズ</div>
    <div class="subtitle">今日学んだことを確認しよう！全5問</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-text">問題 1 / 5</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>

  <div class="card" id="quiz-card">
    <div class="q-number" id="q-num">QUESTION 01</div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
    <div class="explanation" id="explanation">
      <div class="exp-title">💡 解説</div>
      <div id="exp-text"></div>
    </div>
    <button class="next-btn" id="next-btn">次の問題へ →</button>
  </div>

  <div class="card result" id="result">
    <div class="result-score" id="result-score"></div>
    <div class="result-label">正解数 / 5問</div>
    <div class="result-msg" id="result-msg"></div>
    <div class="breakdown">
      <div class="breakdown-title">CHAPTER BREAKDOWN</div>
      <div id="chapters"></div>
    </div>
    <button class="retry-btn" onclick="restart()">もう一度挑戦する</button>
  </div>
</div>

<script>
const questions = [
  {
    chapter: 'Figmaとは',
    q: "Figmaが現場で広く使われている理由として正しいのはどれですか？",
    opts: [
      "有料プランが安いから",
      "ブラウザで使えてURLを共有するだけでチームで共同作業できるから",
      "Photoshopより高機能だから",
      "日本語専用に設計されているから"
    ],
    ans: 1,
    exp: "Figmaはブラウザで動くので、インストール不要でURLを送るだけでチーム全員が同じデザインをリアルタイムで確認・編集できます。この手軽さと共有のしやすさが現場に浸透した最大の理由です！"
  },
  {
    chapter: 'デザインカンプ',
    q: "デザインカンプを作る目的として最も正しいのはどれですか？",
    opts: [
      "Webサイトを実際に動かすプログラムを書くため",
      "Webサイトの完成イメージをクライアントと共有・確認するため",
      "画像データを圧縮して保存するため",
      "コードを自動生成するため"
    ],
    ans: 1,
    exp: "デザインカンプは「こういうデザインで作りましょう」という完成イメージ図です。実際に作り始める前にクライアントと認識をすり合わせるために使います。後から「思っていたのと違う」というトラブルを防ぐための大事なステップです！"
  },
  {
    chapter: 'フレーム',
    q: "Figmaの「フレーム」とは何ですか？",
    opts: [
      "デザインを囲む飾り枠のこと",
      "デザインを描くための「画用紙」のような領域",
      "画像をトリミングする機能のこと",
      "テキストを入力するための専用エリア"
    ],
    ans: 1,
    exp: "フレームはデザインを描くための「画用紙」です。Webサイトなら1ページ分の領域として使います。昔は「アートボード」と呼ばれていたので、他のツールや古い資料ではそちらの名前が出てくることもあります。"
  },
  {
    chapter: 'デザイン作成',
    q: "Figmaで図形の中に画像を入れるとき、どこから操作しますか？",
    opts: [
      "ファイルメニューから「画像を開く」を選ぶ",
      "図形を選択して右パネルの「塗り」から画像を設定する",
      "画像をダブルクリックして貼り付ける",
      "ツールバーの「画像」ボタンを押す"
    ],
    ans: 1,
    exp: "図形を選択した状態で右パネルの「塗り」から画像を選ぶと、図形の中に画像を入れることができます。今日の演習でヘッダーやメインビジュアルを作るときに使いましたね！"
  },
  {
    chapter: 'デザイン作成',
    q: "デザインカンプを作るとき、最初にやることとして正しいのはどれですか？",
    opts: [
      "いきなり文字を入力する",
      "まずガイド（目安線）を引いてから各パーツを配置する",
      "背景色を塗りつぶしてから始める",
      "完成イメージを見ないで作り始める"
    ],
    ans: 1,
    exp: "デザインカンプを作るときは、まずガイドを引いてレイアウトの基準を決めることが大切です。ガイドがあることで要素の位置が揃い、プロらしいきれいなデザインに仕上がります。今日の演習でも最初にガイドを引きましたね！"
  }
];

const chapterResults = {};
let current = 0, score = 0, answered = false;

function render() {
  const q = questions[current];
  document.getElementById('q-num').textContent = `QUESTION 0${current+1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog-text').textContent = `問題 ${current+1} / ${questions.length}`;
  const pct = Math.round((current / questions.length) * 100);
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('explanation').classList.remove('show');
  document.getElementById('next-btn').classList.remove('show');
  answered = false;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach((o, i) => {
    const labels = ['A','B','C','D'];
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="opt-label">${labels[i]}</span><span>${o}</span>`;
    div.onclick = () => select(i);
    opts.appendChild(div);
  });
}

function select(i) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o => o.classList.add('disabled'));
  const isCorrect = i === q.ans;
  opts[i].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) opts[q.ans].classList.add('correct');
  if (isCorrect) score++;
  if (!chapterResults[q.chapter]) chapterResults[q.chapter] = { correct: 0, total: 0 };
  chapterResults[q.chapter].total++;
  if (isCorrect) chapterResults[q.chapter].correct++;
  document.getElementById('exp-text').textContent = q.exp;
  document.getElementById('explanation').classList.add('show');
  const btn = document.getElementById('next-btn');
  btn.textContent = current < questions.length - 1 ? '次の問題へ →' : '結果を見る';
  btn.classList.add('show');
}

document.getElementById('next-btn').onclick = () => {
  current++;
  if (current < questions.length) render();
  else showResult();
};

function showResult() {
  document.getElementById('quiz-card').style.display = 'none';
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-pct').textContent = '100%';
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('result-score').textContent = `${score} / ${questions.length}`;
  const msgs = [
  '0問正解！実はこれがいちばんラッキーかもしれない。人間の脳は「間違えた瞬間」に強い感情が動き、その体験が記憶として深く刻まれます（エラー駆動学習）。正解し続けるより、間違えて「あ、そういうことか！」と気づく経験の方が長期記憶に残りやすいんです。今日の間違いは、次回の確実な正解になる。',
  '1問正解！今日初めてFigmaに触れて、最後まで一緒に進んでくれた。それだけで本当にえらい！1問取れたってことは、理解の種はもう植わってる！',
  '2問正解！半分取れた！Figmaの考え方、ちゃんと頭に入ってきてる証拠だよ。頑張っててとってもえらいです！次回が楽しみ！',
  '3問正解！しっかり聞けてた！今日ここに来て手を動かしてくれたこと、それだけでもう十分すごい。この感覚を大事にしてほしい！',
  '4問正解！ほぼ完璧！今日の内容しっかり自分のものになってる。頑張っててとってもえらいです！この調子で次回も来てね！',
  '満点！完璧！今日初めてFigmaに触れてこの結果は本当にすごい！ここまで来てくれて、手を動かして、最後まで頑張ってくれた。とってもえらいです！自信を持って次も来てね！'
];
  document.getElementById('result-msg').textContent = msgs[score];

  const ch = document.getElementById('chapters');
  ch.innerHTML = '';
  Object.entries(chapterResults).forEach(([name, res]) => {
    const pct = Math.round((res.correct / res.total) * 100);
    ch.innerHTML += `
      <div class="chapter-item">
        <div class="chapter-label"><span>${name}</span><span>${res.correct}/${res.total}</span></div>
        <div class="chapter-bar"><div class="chapter-fill" style="width:${pct}%"></div></div>
      </div>`;
  });
}

function restart() {
  current = 0; score = 0;
  Object.keys(chapterResults).forEach(k => delete chapterResults[k]);
  document.getElementById('quiz-card').style.display = 'block';
  document.getElementById('result').classList.remove('show');
  render();
}

render();
</script>
</body>
</html>
