<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSE5 休憩クイズ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFE135;
    --pink: #FF6B9D;
    --blue: #4ECDC4;
    --orange: #FF8C42;
    --purple: #A855F7;
    --green: #06D6A0;
    --red: #FF4757;
    --dark: #1a1a2e;
    --white: #FFFDF7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--yellow);
    min-height: 100vh;
    font-family: 'Noto Sans JP', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    width: 300px; height: 300px;
    background: var(--pink);
    border-radius: 50%;
    top: -100px; right: -80px;
    opacity: 0.5;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    width: 200px; height: 200px;
    background: var(--blue);
    border-radius: 50%;
    bottom: -60px; left: -60px;
    opacity: 0.5;
    z-index: 0;
  }
  .container { width: 100%; max-width: 600px; position: relative; z-index: 1; }
  .header { text-align: center; margin-bottom: 28px; }
  .badge {
    display: inline-block;
    background: var(--dark);
    color: var(--yellow);
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 3px;
    padding: 6px 20px;
    border-radius: 100px;
    margin-bottom: 14px;
  }
  .title {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 38px;
    color: var(--dark);
    line-height: 1.1;
    text-shadow: 4px 4px 0 rgba(0,0,0,0.1);
  }
  .subtitle { font-size: 14px; color: var(--dark); margin-top: 8px; opacity: 0.7; font-weight: 700; }
  .progress-wrap { margin-bottom: 20px; }
  .progress-info { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
  .progress-bar { height: 12px; background: rgba(0,0,0,0.15); border-radius: 100px; overflow: hidden; border: 2px solid var(--dark); }
  .progress-fill { height: 100%; background: var(--dark); border-radius: 100px; transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .card {
    background: var(--white);
    border: 3px solid var(--dark);
    border-radius: 24px;
    padding: 32px;
    box-shadow: 6px 6px 0 var(--dark);
  }
  .q-number { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 13px; color: var(--pink); letter-spacing: 2px; margin-bottom: 12px; }
  .q-text { font-size: 20px; font-weight: 900; color: var(--dark); line-height: 1.5; margin-bottom: 24px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    background: var(--white);
    border: 2.5px solid var(--dark);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 15px; font-weight: 700; color: var(--dark);
    box-shadow: 3px 3px 0 var(--dark);
  }
  .opt:hover:not(.disabled) { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--dark); background: var(--yellow); }
  .opt:active:not(.disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--dark); }
  .opt-label {
    width: 32px; height: 32px;
    background: var(--dark); color: var(--yellow);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px;
    flex-shrink: 0;
  }
  .opt.correct { background: #ECFDF5; border-color: var(--green); box-shadow: 3px 3px 0 var(--green); }
  .opt.correct .opt-label { background: var(--green); color: var(--dark); }
  .opt.wrong { background: #FFF1F2; border-color: var(--red); box-shadow: 3px 3px 0 var(--red); }
  .opt.wrong .opt-label { background: var(--red); color: var(--white); }
  .opt.disabled { cursor: default; }
  .explanation {
    margin-top: 20px; padding: 16px 18px;
    background: var(--yellow);
    border: 2.5px solid var(--dark);
    border-radius: 14px;
    font-size: 14px; line-height: 1.8; color: var(--dark); font-weight: 700;
    display: none;
  }
  .explanation.show { display: block; }
  .exp-title { font-weight: 900; font-size: 13px; margin-bottom: 6px; }
  .next-btn {
    margin-top: 20px; width: 100%; padding: 16px;
    background: var(--dark); color: var(--yellow);
    border: none; border-radius: 14px;
    font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 16px;
    cursor: pointer; display: none;
    transition: all 0.15s;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
  }
  .next-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 rgba(0,0,0,0.3); }
  .next-btn.show { display: block; }
  .result { text-align: center; display: none; }
  .result.show { display: block; }
  .result-emoji { font-size: 64px; margin-bottom: 8px; animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  .result-score { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 80px; color: var(--dark); line-height: 1; margin-bottom: 4px; }
  .result-label { font-size: 15px; font-weight: 700; color: var(--dark); opacity: 0.6; margin-bottom: 20px; }
  .result-msg { font-size: 16px; font-weight: 700; line-height: 1.7; color: var(--dark); margin-bottom: 28px; background: rgba(0,0,0,0.06); padding: 16px 20px; border-radius: 14px; border: 2px solid rgba(0,0,0,0.1); }
  .btn-group { display: flex; flex-direction: column; gap: 10px; }
  .retry-btn { padding: 16px; background: var(--dark); color: var(--yellow); border: none; border-radius: 14px; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 4px 4px 0 rgba(0,0,0,0.3); transition: all 0.15s; }
  .retry-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(0,0,0,0.3); }
  .retry-wrong-btn { padding: 16px; background: transparent; color: var(--dark); border: 2.5px solid var(--dark); border-radius: 14px; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 3px 3px 0 var(--dark); transition: all 0.15s; display: none; }
  .retry-wrong-btn:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--dark); }
  .retry-wrong-btn.show { display: block; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="badge">SSE5 · FINAL QUIZ</div>
    <div class="title">総復習クイズ 🎯</div>
    <div class="subtitle">今日学んだことを確認しよう！全5問</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-info"><span id="prog-text">問題 1 / 3</span><span id="prog-pct">0%</span></div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="card" id="quiz-card">
    <div class="q-number" id="q-num">QUESTION 01</div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
    <div class="explanation" id="explanation"><div class="exp-title">💡 解説</div><div id="exp-text"></div></div>
    <button class="next-btn" id="next-btn">次の問題へ →</button>
  </div>
  <div class="card result" id="result">
    <div class="result-emoji" id="result-emoji">🎉</div>
    <div class="result-score" id="result-score"></div>
    <div class="result-label">正解数 / 5問</div>
    <div class="result-msg" id="result-msg"></div>
    <div id="chapters" style="margin-bottom:20px;text-align:left;"></div>
    <div class="btn-group">
      <button class="retry-btn" onclick="restart()">もう一度最初から 🔄</button>
      <button class="retry-wrong-btn" id="retry-wrong-btn" onclick="retryWrong()">間違えた問題だけもう一度</button>
    </div>
  </div>
</div>
<script>
const allQuestions = [
  {
    chapter: "CSSの読み込み",
    q: "CSSを読み込むときに使うHTMLタグはどれ？",
    opts: ["<css>", "<script>", "<link>", "<style>"],
    ans: 2,
    exp: "正解は <link> です！<link rel=\"stylesheet\" href=\"ファイル名\"> と書いてCSSファイルを読み込みます。前半でもやりましたね。完璧です！"
  },
  {
    chapter: "メディアクエリ",
    q: "@media screen and (min-width: 641px) はどんな画面に適用される？",
    opts: ["幅641px以下のスマホ", "幅641px以上のPC・タブレット", "全ての画面", "テレビだけ"],
    ans: 1,
    exp: "正解！min-widthは「この幅以上」という意味です。641px以上の画面＝PC・タブレット用のCSSになります！スマホ用はmax-widthを使いますよ。"
  },
  {
    chapter: "ヘッダーCSS",
    q: "ロゴとナビゲーションを横並びにするCSSはどれ？",
    opts: ["display: none", "float または flexbox", "margin: auto", "color: red"],
    ans: 1,
    exp: "正解！今日の演習では float: left と float: right を使ってロゴを左・ナビを右に配置しました。flexboxを使っても同じことができます！"
  },
  {
    chapter: "margin",
    q: "左側にmargin（要素の外側の空白）をつけたいとき、どう書く？",
    opts: ["margin-right: 20px", "margin-top: 20px", "font-size: 20px", "margin-left: 20px"],
    ans: 3,
    exp: "正解！left・right・top・bottomで方向を指定できます。今日の演習では margin-left: 20px でナビゲーションのliに左の余白をつけましたね！"
  },
  {
    chapter: "margin",
    q: "上下左右それぞれに違うmarginをつけたいとき、どう書く？",
    opts: ["margin-all: 10px", "margin: 10px 20px 30px 40px", "margarin-jam: 10px", "パンにバターを塗る"],
    ans: 1,
    exp: "正解！margin: 上 右 下 左 の順番で4つの値を書けます。個別に書くなら margin-top・margin-right・margin-bottom・margin-left をそれぞれ書く方法もあります！"
  }
];

const emojis = ['😢', '🙁', '🙂', '😄', '😁', '🎉'];
let questions = [...allQuestions];
let wrongIndices = [];
let current = 0, score = 0, answered = false, isRetryMode = false;
const chapterResults = {};

function escHTML(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function render() {
  const q = questions[current];
  const total = questions.length;
  document.getElementById('q-num').textContent = `QUESTION 0${current+1}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog-text').textContent = `問題 ${current+1} / ${total}`;
  const pct = Math.round((current / total) * 100);
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('explanation').classList.remove('show');
  document.getElementById('next-btn').classList.remove('show');
  answered = false;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach((o, i) => {
    const labels = ['A','B','C','D'];
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<span class="opt-label">${labels[i]}</span><span>${escHTML(o)}</span>`;
    div.onclick = () => select(i);
    opts.appendChild(div);
  });
}

function select(i) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o => o.classList.add('disabled'));
  const isCorrect = i === q.ans;
  opts[i].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) {
    opts[q.ans].classList.add('correct');
    if (!isRetryMode) wrongIndices.push(allQuestions.indexOf(q));
  }
  if (isCorrect) score++;
  if (!chapterResults[q.chapter]) chapterResults[q.chapter] = { correct: 0, total: 0 };
  chapterResults[q.chapter].total++;
  if (isCorrect) chapterResults[q.chapter].correct++;
  document.getElementById('exp-text').textContent = q.exp;
  document.getElementById('explanation').classList.add('show');
  const btn = document.getElementById('next-btn');
  btn.textContent = current < questions.length - 1 ? '次の問題へ →' : '結果を見る 🎯';
  btn.classList.add('show');
}

document.getElementById('next-btn').onclick = () => {
  current++;
  if (current < questions.length) render();
  else showResult();
};

function showResult() {
  document.getElementById('quiz-card').style.display = 'none';
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('prog-pct').textContent = '100%';
  document.getElementById('result').classList.add('show');
  document.getElementById('result-score').textContent = `${score} / ${questions.length}`;
  document.getElementById('result-emoji').textContent = emojis[score] || '🎉';
  const msgs = [
    "0問正解！大丈夫、間違えた瞬間が一番記憶に残ります。今日ここに来て手を動かしてくれただけで十分すごい！",
    "1問正解！ここに来て、聞いて、参加してくれた。それだけでもう十分えらいです！1問取れたということは確実に理解が始まってる証拠！",
    "2問正解！今日の内容、自分のものになってきてる。頑張っててとってもえらいです！",
    "3問正解！しっかり聞けてた証拠。今日ここに来て真剣に取り組んでくれた、それが一番大事！",
    "4問正解！ほぼ完璧！今日の内容しっかり自分のものになってる。最高です！",
    "満点！完璧！！今日学んだこと全部バッチリ理解できてる！linkタグ・リセットCSS・float・margin、全部頭に入ってる。最高にえらい！！"
  ];
  document.getElementById('result-msg').textContent = msgs[score];
  if (!isRetryMode) {
    const ch = document.getElementById('chapters');
    ch.innerHTML = '<div style="font-size:12px;font-weight:900;letter-spacing:2px;color:rgba(0,0,0,0.4);margin-bottom:12px;text-align:center;">CHAPTER BREAKDOWN</div>';
    Object.entries(chapterResults).forEach(([name, res]) => {
      const pct = Math.round((res.correct / res.total) * 100);
      ch.innerHTML += `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--dark);margin-bottom:4px"><span>${name}</span><span>${res.correct}/${res.total}</span></div><div style="height:8px;background:rgba(0,0,0,0.1);border-radius:100px;border:1.5px solid var(--dark);overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--dark);border-radius:100px;transition:width 0.8s ease"></div></div></div>`;
    });
  }
  if (wrongIndices.length > 0 && !isRetryMode) document.getElementById('retry-wrong-btn').classList.add('show');
}

function restart() {
  questions = [...allQuestions]; wrongIndices = []; current = 0; score = 0; isRetryMode = false;
  Object.keys(chapterResults).forEach(k => delete chapterResults[k]);
  document.getElementById('chapters').innerHTML = '';
  document.getElementById('quiz-card').style.display = 'block';
  document.getElementById('result').classList.remove('show');
  document.getElementById('retry-wrong-btn').classList.remove('show');
  render();
}

function retryWrong() {
  questions = wrongIndices.map(i => allQuestions[i]); current = 0; score = 0; isRetryMode = true;
  document.getElementById('quiz-card').style.display = 'block';
  document.getElementById('result').classList.remove('show');
  document.getElementById('retry-wrong-btn').classList.remove('show');
  render();
}

render();
</script>
</body>
</html>
