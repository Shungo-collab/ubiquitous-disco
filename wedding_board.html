<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千葉大次郎 & 鈴木千笑 ご入籍おめでとう</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@300;400&family=Lato:wght@300;400&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #c8a880;
    --accent-dark: #5a3e2b;
    --bg: #faf7f2;
    --surface: #fff;
    --text: #3a3028;
    --text-muted: #8a7060;
    --border: #e8d8c0;
    --dark-bg: #2a1f18;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Noto Serif JP', serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

  /* HERO */
  .hero { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: linear-gradient(160deg, #fdf9f3 0%, #f5ede0 50%, #ede0d0 100%); overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(ellipse 80% 60% at 20% 80%, rgba(210,170,130,0.15) 0%, transparent 60%), radial-gradient(ellipse 60% 80% at 80% 20%, rgba(220,190,160,0.12) 0%, transparent 60%); pointer-events: none; }
  .petals-container { position: absolute; inset: 0; pointer-events: none; }
  .petal { position: absolute; background: rgba(210,160,140,0.35); animation: fall linear infinite; }
  @keyframes fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.5; } 100% { transform: translateY(105vh) rotate(720deg); opacity: 0; } }

  .hero-content { position: relative; z-index: 1; text-align: center; padding: 2rem 1.5rem; }
  .hero-label { display: none; }

  /* 筆書きテキスト共通 */
  .write-text {
    font-family: 'Dancing Script', cursive;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--accent-dark);
    text-stroke: 1.5px var(--accent-dark);
    background: linear-gradient(to right, var(--accent-dark) 50%, transparent 50%);
    background-size: 200% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text;
    background-clip: text;
    display: block;
  }
  .write-text.writing {
    animation: writeIn 1.8s ease forwards;
  }
  .write-text.writing-fast {
    animation: writeIn 1.2s ease forwards;
  }
  @keyframes writeIn {
    from { background-position: 100% 0; -webkit-text-stroke-color: var(--accent-dark); }
    to   { background-position: 0% 0; -webkit-text-stroke-color: transparent; color: var(--accent-dark); }
  }

  /* congratulations行 */
  .hero-congrats {
    font-size: clamp(1.6rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 0.5rem;
    line-height: 1.2;
  }

  /* on your marriage行 */
  .hero-on {
    font-size: clamp(1.2rem, 3.5vw, 2rem);
    font-weight: 400;
    letter-spacing: 0.04em;
    color: transparent;
    -webkit-text-stroke: 1px #9a7858;
    background: linear-gradient(to right, #9a7858 50%, transparent 50%);
    background-size: 200% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text;
    background-clip: text;
    margin-bottom: 2rem;
  }
  .hero-on.writing-fast {
    animation: writeInMuted 1.2s ease forwards;
  }
  @keyframes writeInMuted {
    from { background-position: 100% 0; }
    to   { background-position: 0% 0; -webkit-text-stroke-color: transparent; color: #9a7858; }
  }

  /* 名前 */
  .hero-names {
    line-height: 1.15;
    letter-spacing: 0.02em;
    margin-bottom: 0.2rem;
  }
  .hero-name-item {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(3rem, 11vw, 6.5rem);
    font-weight: 700;
    color: transparent;
    -webkit-text-stroke: 2px var(--accent-dark);
    background: linear-gradient(to right, var(--accent-dark) 50%, transparent 50%);
    background-size: 200% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text;
    background-clip: text;
    display: block;
  }
  .hero-name-item.writing {
    animation: writeInName 2s ease forwards;
  }
  @keyframes writeInName {
    from { background-position: 100% 0; }
    to   { background-position: 0% 0; -webkit-text-stroke-color: transparent; color: var(--accent-dark); }
  }
  .hero-amp-line {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(1.8rem, 5vw, 3rem);
    color: var(--accent);
    display: block;
    margin: 0.1em 0;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .hero-amp-line.show { opacity: 1; }

  /* シーケンス共通 */
  .hero-seq { opacity: 0; transform: translateY(10px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .hero-seq.show { opacity: 1; transform: translateY(0); }

  .hero-divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem auto; width: 180px; }
  .hero-divider::before, .hero-divider::after { content: ''; flex: 1; height: 0.5px; background: var(--accent); }
  .hero-divider span { color: var(--accent); font-size: 11px; }
  .hero-sub { font-family: 'Lato', sans-serif; font-weight: 300; font-size: 11px; letter-spacing: 0.35em; color: #9a7858; text-transform: uppercase; }
  .scroll-hint { position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); font-family: 'Lato', sans-serif; font-size: 10px; letter-spacing: 0.35em; color: #a08060; text-transform: uppercase; z-index: 1; opacity: 0; transition: opacity 0.8s ease; }
  .scroll-hint.show { opacity: 1; animation: bounce 2.2s ease infinite; }
  @keyframes bounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(7px); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

  /* SLIDESHOW - fullscreen */
  .slideshow-section { position: relative; width: 100%; height: 100svh; overflow: hidden; background: #0e0a08; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
  .slide.active { opacity: 1; }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.04); transition: transform 8s ease; }
  .slide.active img { transform: scale(1); }

  .slide-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.0) 40%, rgba(0,0,0,0.5) 100%); pointer-events: none; }

  .slide-caption { position: absolute; bottom: 3rem; left: 50%; transform: translateX(-50%); text-align: center; z-index: 2; }
  .slide-caption-text { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-style: italic; font-size: clamp(1rem, 3vw, 1.4rem); color: rgba(255,245,230,0.8); letter-spacing: 0.1em; }

  .slideshow-controls { position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 1rem; z-index: 3; }
  .slide-btn { background: rgba(255,255,255,0.1); border: 0.5px solid rgba(200,168,128,0.4); color: var(--accent); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; backdrop-filter: blur(4px); }
  .slide-btn:hover { background: rgba(200,168,128,0.2); border-color: var(--accent); }
  .slide-dots { display: flex; gap: 7px; }
  .slide-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(200,168,128,0.35); cursor: pointer; transition: all 0.3s; }
  .slide-dot.active { background: var(--accent); width: 20px; border-radius: 3px; }

  .section-header { position: absolute; top: 2.5rem; left: 50%; transform: translateX(-50%); text-align: center; z-index: 2; white-space: nowrap; }
  .section-eyebrow { font-family: 'Lato', sans-serif; font-weight: 300; font-size: 10px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(200,168,128,0.6); margin-bottom: 0.4rem; }
  .section-title { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(1.4rem, 4vw, 2rem); letter-spacing: 0.06em; color: rgba(232,216,192,0.9); }
  .slideshow-outer { display: contents; }

  /* MESSAGES - envelope UI */
  .messages-section { background: var(--bg); padding: 5rem 1.5rem 6rem; }

  /* 封筒グリッド */
  .envelopes-area { max-width: 900px; margin: 0 auto; }
  .refresh-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  .msg-count { font-family: 'Lato', sans-serif; font-size: 12px; color: var(--text-muted); }
  .msg-count span { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: var(--accent); margin-right: 4px; }
  .refresh-btn { display: flex; align-items: center; gap: 6px; background: none; border: 0.5px solid var(--border); border-radius: 100px; padding: 7px 16px; font-size: 12px; font-family: 'Lato', sans-serif; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent-dark); }

  .envelopes-grid { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }

  /* 封筒カード */
  .envelope-wrap { position: relative; }
  .envelope {
    width: 100px; height: 72px;
    background: #fff8f0;
    border: 0.5px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    overflow: visible;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .envelope:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(90,62,43,0.12); }

  /* 封筒フラップ（上三角） */
  .envelope-flap {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-top: 36px solid #eddcc8;
    z-index: 2;
    transform-origin: top center;
    transition: transform 0.4s ease;
  }
  .envelope.open .envelope-flap { transform: rotateX(180deg); }

  /* 封筒底面の三角 */
  .envelope::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 0;
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-bottom: 36px solid #e8d0b8;
    z-index: 1;
  }
  /* 封筒左右の三角 */
  .envelope::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background:
      linear-gradient(135deg, #eddcc8 50%, transparent 50%),
      linear-gradient(225deg, #eddcc8 50%, transparent 50%);
    background-size: 50% 100%, 50% 100%;
    background-position: left, right;
    background-repeat: no-repeat;
    z-index: 0;
  }

  /* 封筒の差出人名 */
  .envelope-name {
    position: absolute;
    bottom: -1.4rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Lato', sans-serif;
    font-size: 10px;
    color: var(--text-muted);
    white-space: nowrap;
    letter-spacing: 0.03em;
  }

  /* ♥ シール */
  .envelope-seal {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    color: var(--accent);
    font-size: 14px;
    transition: opacity 0.3s;
  }
  .envelope.open .envelope-seal { opacity: 0; }

  /* モーダルオーバーレイ */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(40,25,15,0.55);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .modal-overlay.show { display: flex; }

  /* モーダルカード */
  .modal-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 2rem 1.75rem 1.75rem;
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
    animation: cardOpen 0.35s ease both;
  }
  @keyframes cardOpen {
    from { opacity: 0; transform: translateY(20px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-close {
    position: absolute;
    top: 1rem; right: 1rem;
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: 50%;
    width: 30px; height: 30px;
    cursor: pointer;
    font-size: 16px;
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .modal-close:hover { border-color: var(--accent); color: var(--accent-dark); }

  .modal-card::before { content: '\201C'; font-family: 'Cormorant Garamond', serif; font-size: 5rem; color: #eddec8; position: absolute; top: -0.6rem; left: 1.25rem; line-height: 1; pointer-events: none; }

  .msg-dear { font-family: 'Lato', sans-serif; font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: #b09070; margin-bottom: 0.3rem; }
  .msg-to { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; color: var(--accent-dark); margin-bottom: 1rem; }
  .msg-body { font-size: 0.875rem; line-height: 1.95; color: #5a4838; padding-top: 0.25rem; white-space: pre-wrap; word-break: break-word; }
  .msg-photo { margin-top: 1rem; border-radius: 8px; overflow: hidden; }
  .msg-photo img { width: 100%; max-height: 240px; object-fit: cover; display: block; }
  .msg-from-line { display: flex; align-items: center; gap: 10px; margin-top: 1.25rem; padding-top: 1rem; border-top: 0.5px solid var(--border); }
  .msg-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #d4b090, #c89870); display: flex; align-items: center; justify-content: center; font-family: 'Lato', sans-serif; font-size: 12px; color: white; flex-shrink: 0; }
  .msg-from-label { font-family: 'Lato', sans-serif; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: #b09070; display: block; }
  .msg-from-name { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--accent-dark); }

  .empty-state { text-align: center; padding: 4rem 1rem; color: var(--text-muted); font-size: 14px; width: 100%; }

  /* Progress bar */
  .slide-progress { position: absolute; top: 0; left: 0; width: 100%; height: 3px; z-index: 4; display: flex; gap: 3px; padding: 0 1.5rem; box-sizing: border-box; }
  .slide-progress-item { flex: 1; height: 100%; background: rgba(200,168,128,0.25); border-radius: 2px; overflow: hidden; }
  .slide-progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s linear; }
  .slide-progress-fill.complete { width: 100%; transition: none; }

  /* FOOTER */
  .footer { background: var(--dark-bg); text-align: center; padding: 3.5rem 1.5rem; }
  .footer-names { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 1.7rem; color: #e8d8c0; letter-spacing: 0.08em; margin-bottom: 0.5rem; white-space: nowrap; }
  .footer-names .amp { font-style: italic; color: var(--accent); }
  .footer-date { font-family: 'Lato', sans-serif; font-size: 11px; letter-spacing: 0.35em; color: #6a5848; text-transform: uppercase; }
</style>
</head>

  // ---- Hero sequence ----

      `opacity:${0.15+Math.random()*0.35}`
    ].join(';');
    petalsEl.appendChild(p);
  }

  // ---- Slideshow ----
  const slideshowEl = document.getElementById('slideshow');
  const dotsEl = document.getElementById('slide-dots');
  const progressEl = document.getElementById('slide-progress');
  let currentSlide = 0, slideTimer, progressTimer, progressStart;
  const SLIDE_DURATION = 4500;

  SLIDE_PHOTOS.forEach((src, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide' + (i===0?' active':'');
    slide.innerHTML = `<img src="${src}" alt="Photo ${i+1}" loading="lazy">`;
    slideshowEl.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'slide-dot' + (i===0?' active':'');
    dot.onclick = () => goToSlide(i);
    dotsEl.appendChild(dot);

    const item = document.createElement('div');
    item.className = 'slide-progress-item';
    const fill = document.createElement('div');
    fill.className = 'slide-progress-fill' + (i===0?'':' complete');
    item.appendChild(fill);
    progressEl.appendChild(item);
  });

  function startProgress() {
    const fills = progressEl.querySelectorAll('.slide-progress-fill');
    fills.forEach((f, i) => {
      f.style.transition = 'none';
      f.style.width = i < currentSlide ? '100%' : i === currentSlide ? '0%' : '0%';
    });
    requestAnimationFrame(() => {
      fills[currentSlide].style.transition = `width ${SLIDE_DURATION}ms linear`;
      fills[currentSlide].style.width = '100%';
    });
  }

  function goToSlide(n) {
    const slides = slideshowEl.querySelectorAll('.slide');
    const dots = dotsEl.querySelectorAll('.slide-dot');
    slides[currentSlide].classList.remove('active');
    dots[currentSlide].classList.remove('active');
    currentSlide = (n + slides.length) % slides.length;
    slides[currentSlide].classList.add('active');
    dots[currentSlide].classList.add('active');
    clearInterval(slideTimer);
    startProgress();
    slideTimer = setInterval(() => goToSlide(currentSlide+1), SLIDE_DURATION);
  }

  document.getElementById('slide-prev').onclick = () => goToSlide(currentSlide-1);
  document.getElementById('slide-next').onclick = () => goToSlide(currentSlide+1);
  startProgress();
  slideTimer = setInterval(() => goToSlide(currentSlide+1), SLIDE_DURATION);

  // ---- Messages ----
  function getInitials(name) {
    const p = name.trim().split(/[\s　]+/);
    return p.length >= 2 ? p[0][0]+p[1][0] : name.slice(0,2);
  }
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  let messagesData = [];

  function openModal(i) {
    const m = messagesData[i];
    document.getElementById('modal-to').textContent = GROOM + ' & ' + BRIDE;
    document.getElementById('modal-body').innerHTML = escHtml(m.message);
    document.getElementById('modal-avatar').textContent = getInitials(m.name);
    document.getElementById('modal-name').textContent = m.name;
    if (m.photo_base64) {
      document.getElementById('modal-img').src = m.photo_base64;
      document.getElementById('modal-photo').style.display = 'block';
    } else {
      document.getElementById('modal-photo').style.display = 'none';
    }
    document.getElementById('modal-overlay').classList.add('show');
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modal-overlay')) {
      document.getElementById('modal-overlay').classList.remove('show');
    }
  }
  function closeModalBtn() {
    document.getElementById('modal-overlay').classList.remove('show');
  }

  async function loadMessages() {
    const grid = document.getElementById('envelopes-grid');
    const { data, error } = await sbClient
      .from(TABLE_NAME).select('*').order('created_at', { ascending: false });

    if (error) { grid.innerHTML = '<div class="empty-state">読み込みに失敗しました</div>'; return; }

    document.getElementById('msg-count-num').textContent = data.length;
    messagesData = data;

    if (data.length === 0) {
      grid.innerHTML = '<div class="empty-state">まだメッセージが届いていません</div>';
      return;
    }

    grid.innerHTML = data.map((m, i) => `
      <div class="envelope-wrap">
        <div class="envelope" id="env-${i}" onclick="openEnvelope(${i})">
          <div class="envelope-flap"></div>
          <div class="envelope-seal">&#9825;</div>
        </div>
        <div class="envelope-name">${escHtml(m.name)}</div>
      </div>
    `).join('');
  }

  function openEnvelope(i) {
    const env = document.getElementById('env-' + i);
    env.classList.add('open');
    setTimeout(() => openModal(i), 350);
  }

  loadMessages();
  if (AUTO_RELOAD_INTERVAL > 0) setInterval(loadMessages, AUTO_RELOAD_INTERVAL);
</script>
</body>
</html>
